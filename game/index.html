<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vermilion Harbor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #selftest { position: absolute; left: 0; top: 0; color: #0f0; background: #000; font-size: 10px; z-index: 9; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vermilion Harbor: an open-world crime game in a neon port city — steal cars, outrun the police, run ten story jobs and take the harbor"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
